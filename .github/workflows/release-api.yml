name: Release — API

# Tag-triggered (trunk-based release model). Changesets is the ONLY version
# bumper (release-version.yml, merged to main) — this workflow never computes
# a bump, runs `npm version`, or pushes a commit/tag. A human authors the tag
# by hand after the Version PR merges (see docs/ops/CICD_PIPELINE.md
# "How to cut a release"), and pushing it is what starts a release.
#
# Tag grammar (see the `resolve` job):
#   api-vX.Y.Z            → production
#   api-vX.Y.Z-staging    → staging
#
# workflow_dispatch exists only to re-run a release against an ALREADY-PUSHED
# tag (e.g. retry a flaky build-and-push) — it takes the tag name as input
# rather than any version/bump inputs, so there is exactly one place version
# resolution happens.
on:
  push:
    tags:
      - 'api-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. api-v1.2.3 or api-v1.2.3-staging'
        required: true
        type: string

concurrency:
  # Never cancel an in-flight deploy. Serialize per environment. Top-level
  # `concurrency:` can't see job outputs (`needs` isn't in scope here), so
  # the environment is re-derived inline from the same tag the `resolve` job
  # parses authoritatively — this is only a grouping key, not a source of
  # truth for the release itself.
  group: release-api-${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-staging') && 'staging' || 'production' }}
  cancel-in-progress: false

# Nothing in this workflow pushes commits or tags anymore, so the top-level
# grant is read-only. Jobs that genuinely need writes (ghcr push, GitHub
# Release creation) re-declare their own permissions block below.
permissions:
  contents: read

jobs:
  # ── Parse the tag into version + target environment ────────────────
  # This is the single source of truth for "what does this tag mean" — every
  # other job consumes these outputs instead of re-deriving them.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Parse tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ "$TAG" =~ ^api-v([0-9]+\.[0-9]+\.[0-9]+)(-staging)?$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            if [ -n "${BASH_REMATCH[2]}" ]; then
              ENVIRONMENT="staging"
            else
              ENVIRONMENT="production"
            fi
          else
            echo "::error::Tag '$TAG' does not match the api release tag grammar. Expected api-vX.Y.Z (production) or api-vX.Y.Z-staging (staging)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> version=$VERSION environment=$ENVIRONMENT"

  # ── Lint + typecheck + test gate, plus the version-consistency guard ─
  validate:
    name: API — Validate
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm

      # Changesets (release-version.yml, on push to main) is the ONLY thing
      # allowed to bump apps/api/package.json. If the version baked into the
      # tag doesn't match the version actually committed at that tag, someone
      # tagged a commit whose version was never bumped by the Version PR —
      # shipping it would desync the running service's reported version from
      # its source. Fail loudly instead of shipping a mislabeled release.
      - name: Version-consistency guard
        run: |
          TAG_VERSION="${{ needs.resolve.outputs.version }}"
          PKG_VERSION=$(node -p "require('./apps/api/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/api/package.json version ($PKG_VERSION) at ${{ needs.resolve.outputs.tag }}. Versions are bumped exclusively by the Changesets Version PR — merge it first, then tag the resulting commit."
            exit 1
          fi
          echo "Version consistency OK: $TAG_VERSION"

      - name: Install deps
        run: npm ci

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Test
        working-directory: apps/api
        run: npm run test

  # ── Build & Push Docker image ────────────────────────────────────────
  build-and-push:
    name: Build Docker Image
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions REPLACE the top-level block, so we re-declare
    # `contents: read` for actions/checkout. `packages: write` is what was
    # missing — without it, the GITHUB_TOKEN can authenticate to ghcr.io but
    # the actual layer push is denied with "installation not allowed to
    # Write organization package."
    permissions:
      contents: read
      packages: write
    # Production approval gate. This is the human checkpoint the old
    # `release` job used to carry (it required approval before bumping +
    # tagging); with bump/tag gone, the build-and-push of the actual
    # deployable artifact is where that approval now belongs.
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.resolve.outputs.environment == 'production' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            APP_VERSION=${{ env.TAG }}

  # ── Migrate DB (opt-in per GitHub Environment) ──────────────────────
  # There is no tag equivalent of the old `run_migrations` dispatch checkbox,
  # so the opt-in now lives as the `RUN_DB_MIGRATIONS` variable on the
  # `staging` / `production` GitHub Environments (same place DATABASE_URL
  # already lives). Defaults to off — unset or anything other than "true"
  # skips the actual migrate step, matching the old input's default of
  # `false`. See docs/ops/CICD_PIPELINE.md for how to turn it on.
  migrate:
    name: Migrate DB (${{ needs.resolve.outputs.environment }})
    needs: [resolve, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Check migration gate
        id: gate
        run: |
          if [ "${{ vars.RUN_DB_MIGRATIONS }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Migrations skipped — set RUN_DB_MIGRATIONS=true on the ${{ needs.resolve.outputs.environment }} GitHub Environment to enable."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 25
          cache: npm

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run Drizzle migrations
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

  # ── GitHub Release ────────────────────────────────────────────────
  # The "tied to a release" half of the trunk-based model: every successful
  # tag-triggered run gets a corresponding GitHub Release, body pulled from
  # the CHANGELOG section Changesets already wrote for this version.
  github-release:
    name: Create GitHub Release
    needs: [resolve, build-and-push, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' apps/api/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.resolve.outputs.environment == 'staging' }}

  summary:
    name: Summary
    needs: [resolve, build-and-push, migrate, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## API release"
            echo ""
            echo "- **Environment:** ${{ needs.resolve.outputs.environment }}"
            echo "- **Version:** ${{ needs.resolve.outputs.version }}"
            echo "- **Tag:** \`${{ needs.resolve.outputs.tag }}\`"
            echo "- **Image:** ${{ needs.build-and-push.outputs.image-tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
